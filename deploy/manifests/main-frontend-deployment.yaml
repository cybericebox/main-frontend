apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-frontend
  namespace: cybericebox
  labels:
    app: main-frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 3
      maxUnavailable: 0
  selector:
    matchLabels:
      app: main-frontend
  template:
    metadata:
      name: main-frontend
      namespace: cybericebox
      labels:
        app: main-frontend
    spec:
      containers:
        - name: main-frontend
          image: cybericebox/main-frontend:v0.1.0 # the release tag: an exact version, never latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NEXT_PUBLIC_MAIN_HOST
              valueFrom:
                configMapKeyRef:
                  name: main-frontend-config
                  key: MAIN_HOST
            - name: NEXT_PUBLIC_API_HOST
              valueFrom:
                configMapKeyRef:
                  name: main-frontend-config
                  key: API_HOST
            - name: NEXT_PUBLIC_ID_HOST
              valueFrom:
                configMapKeyRef:
                  name: main-frontend-config
                  key: ID_HOST
            - name: NEXT_PUBLIC_ADMIN_HOST
              valueFrom:
                configMapKeyRef:
                  name: main-frontend-config
                  key: ADMIN_HOST
            - name: NEXT_PUBLIC_EXERCISES_HOST
              valueFrom:
                configMapKeyRef:
                  name: main-frontend-config
                  key: EXERCISES_HOST
            - name: NEXT_PUBLIC_EVENT_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: main-frontend-config
                  key: EVENT_DOMAIN
            - name: NEXT_PUBLIC_COOKIE_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: main-frontend-config
                  key: COOKIE_DOMAIN
            - name: NEXT_PUBLIC_SUPPORT_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: main-frontend-config
                  key: SUPPORT_EMAIL
            - name: NEXT_PUBLIC_CONTACT_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: main-frontend-config
                  key: CONTACT_EMAIL
            - name: NEXT_PUBLIC_PRIVACY_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: main-frontend-config
                  key: PRIVACY_EMAIL
            - name: NEXT_PUBLIC_SECURITY_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: main-frontend-config
                  key: SECURITY_EMAIL
            - name: NEXT_PUBLIC_SOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: main-frontend-config
                  key: SOURCE_URL
            - name: NEXT_PUBLIC_PARTNER_URL
              valueFrom:
                configMapKeyRef:
                  name: main-frontend-config
                  key: PARTNER_URL
            - name: NEXT_PUBLIC_PARTNER_SITE_URL
              valueFrom:
                configMapKeyRef:
                  name: main-frontend-config
                  key: PARTNER_SITE_URL
            - name: NEXT_PUBLIC_GOOGLE_ANALYTICS_ID
              valueFrom:
                configMapKeyRef:
                  name: main-frontend-config
                  key: GOOGLE_ANALYTICS_ID
            - name: NEXT_PUBLIC_CAPTCHA_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: main-frontend-config
                  key: CAPTCHA_PROVIDER
                  optional: true
            - name: NEXT_PUBLIC_CAPTCHA_SITE_KEY
              valueFrom:
                configMapKeyRef:
                  name: main-frontend-config
                  key: CAPTCHA_SITE_KEY
                  optional: true
            - name: NEXT_PUBLIC_RECAPTCHA_ENTERPRISE
              valueFrom:
                configMapKeyRef:
                  name: main-frontend-config
                  key: RECAPTCHA_ENTERPRISE
                  optional: true
            - name: NEXT_PUBLIC_DOS_PROTECTION
              valueFrom:
                configMapKeyRef:
                  name: main-frontend-config
                  key: DOS_PROTECTION
                  optional: true
            - name: WARMUP_FLAG
              valueFrom:
                secretKeyRef:
                  name: main-frontend-secret
                  key: WARMUP_FLAG
                  optional: true
          ports:
            - containerPort: 3000
              protocol: TCP
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              port: 3000
              path: /healthz
            initialDelaySeconds: 20
          livenessProbe:
            httpGet:
              port: 3000
              path: /healthz
            initialDelaySeconds: 20
            periodSeconds: 30
