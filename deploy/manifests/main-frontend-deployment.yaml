apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-frontend
  namespace: cybericebox
  labels:
    app: main-frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 3
      maxUnavailable: 0
  selector:
    matchLabels:
      app: main-frontend
  template:
    metadata:
      name: main-frontend
      namespace: cybericebox
      labels:
        app: main-frontend
    spec:
      containers:
        - name: main-frontend
          image: cybericebox/main-frontend:latest
          env:
            - name: NEXT_PUBLIC_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: main-frontend-config
                  key: DOMAIN
            - name: NEXT_PUBLIC_API_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: main-frontend-config
                  key: API_DOMAIN
            - name: NEXT_PUBLIC_ID_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: main-frontend-config
                  key: ID_DOMAIN
            - name: NEXT_PUBLIC_ADMIN_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: main-frontend-config
                  key: ADMIN_DOMAIN
            - name: NEXT_PUBLIC_GOOGLE_ANALYTICS_ID
              valueFrom:
                configMapKeyRef:
                  name: main-frontend-config
                  key: GOOGLE_ANALYTICS_ID
            - name: WARMUP_FLAG
              valueFrom:
                secretKeyRef:
                  name: main-frontend-secret
                  key: WARMUP_FLAG
                  optional: true
          ports:
            - containerPort: 3000
              protocol: TCP
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              port: 3000
              path: /healthz
            initialDelaySeconds: 20
          livenessProbe:
            httpGet:
              port: 3000
              path: /healthz
            initialDelaySeconds: 20
            periodSeconds: 30
