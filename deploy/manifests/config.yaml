apiVersion: v1
kind: ConfigMap
metadata:
  name: main-frontend-config
  namespace: cybericebox
data:
  # Every value is required and comes from the deployment env files (platform.env); no defaults.
  # Hosts are bare hosts without a scheme. Fill these before applying.
  MAIN_HOST: ""
  API_HOST: ""
  ID_HOST: ""
  ADMIN_HOST: ""
  EXERCISES_HOST: ""
  EVENT_DOMAIN: ""
  # Cookie Domain attribute for the shared theme/consent cookies (e.g. the apex), never derived from a host.
  COOKIE_DOMAIN: ""
  CONTACT_EMAIL: ""
  PRIVACY_EMAIL: ""
  SECURITY_EMAIL: ""
  SOURCE_URL: ""
  PARTNER_URL: ""
  PARTNER_SITE_URL: ""
  # Optional Google Analytics 4 measurement id (G-…). Empty → analytics off.
  GOOGLE_ANALYTICS_ID: ""
