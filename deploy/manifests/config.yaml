apiVersion: v1
kind: ConfigMap
metadata:
  name: main-frontend-config
  namespace: cybericebox
data:
  # Every value is required and comes from the deployment env files (platform.env); no defaults.
  # Hosts are bare hosts without a scheme. Fill these before applying.
  MAIN_HOST: ""
  API_HOST: ""
  ID_HOST: ""
  ADMIN_HOST: ""
  EXERCISES_HOST: ""
  EVENT_DOMAIN: ""
  # Cookie Domain attribute for the shared theme/consent cookies (e.g. the apex), never derived from a host.
  COOKIE_DOMAIN: ""
  # REQUIRED: support mailbox of the «Надіслати відгук» (send feedback) link on every page.
  SUPPORT_EMAIL: ""
  CONTACT_EMAIL: ""
  PRIVACY_EMAIL: ""
  SECURITY_EMAIL: ""
  SOURCE_URL: ""
  PARTNER_URL: ""
  PARTNER_SITE_URL: ""
  # Optional Google Analytics 4 measurement id (G-…). Empty → analytics off.
  GOOGLE_ANALYTICS_ID: ""
  # Optional bot check behind the anti-DoS client token: provider turnstile | recaptcha | none (empty = none).
  # CAPTCHA_SITE_KEY is required for turnstile / recaptcha. DOS_PROTECTION on | off (empty = off) must match the backend.
  CAPTCHA_PROVIDER: ""
  CAPTCHA_SITE_KEY: ""
  RECAPTCHA_ENTERPRISE: ""
  DOS_PROTECTION: ""
