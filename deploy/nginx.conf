server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    # Static export with trailingSlash: pages live at /<path>/index.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Warm-up hint file (generated at build time by scripts/warmup.mjs). Plain text, no caching,
    # so a rebuilt image with a new NEXT_PUBLIC_WARMUP_FLAG is picked up immediately.
    location /.well-known/ice/ {
        default_type text/plain;
        types { }
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    error_page 404 /404.html;
}
