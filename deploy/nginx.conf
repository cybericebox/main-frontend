server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    # Content-Security-Policy, generated at container start by deploy/csp.sh. A location that sets its
    # own add_header does not inherit the server-level ones, so it must include this file again.
    include /etc/nginx/snippets/csp.conf;

    # Static export: pages live at /<path>.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location = /healthz {
        access_log off;
        try_files /index.html =503;
    }

    # Warm-up hint file (generated at build time by scripts/warmup.mjs). Plain text, no caching,
    # so a rebuilt image with a new NEXT_PUBLIC_WARMUP_FLAG is picked up immediately.
    location /.well-known/ice/ {
        default_type text/plain;
        types { }
        add_header Cache-Control "no-store";
        include /etc/nginx/snippets/csp.conf;
        try_files $uri =404;
    }

    # RFC 9116 security.txt: must be text/plain with a UTF-8 charset.
    location = /.well-known/security.txt {
        default_type text/plain;
        types { }
        charset utf-8;
        try_files $uri =404;
    }

    error_page 404 /404.html;
}
